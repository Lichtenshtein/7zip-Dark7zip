  build-windows-x64:
    name: Build 7zz.exe for Windows (x64)
    runs-on: windows-latest
#    needs: get-version-info
#    if: needs.get-version-info.outputs.release_exists == 'false'
    steps:
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - uses: actions/checkout@v5
        with:
          repository: Lichtenshtein/7zip-Dark7zip
          ref: Dark7zip-zstd-7zz
          path: Dark7zip-zstd-7zz
      - shell: pwsh
        run: Get-ChildItem && cd Dark7zip-zstd-7zz\CPP\7zip\Bundles\Alone2 && nmake PLATFORM=x64
#      - shell: pwsh
#        run: |
#          mkdir 7zip-doc
#          cp 7zip-src/DOC/*License.txt , 7zip-src/DOC/copying.txt 7zip-doc/
#          cp 7zip-src/DOC/readme.txt , 7zip-src/DOC/src-history.txt 7zip-doc/
      - name: Prepare artifact
        shell: pwsh
        run: |
          mkdir asset
          cp Dark7zip-zstd-7zz-src/CPP/7zip/Bundles/Alone2/x64/7zz.exe asset/
#          cp -r 7zip-doc/ asset/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: asset/

